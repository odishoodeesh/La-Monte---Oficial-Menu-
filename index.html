<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA MONTE (OFFICIAL MENU)</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/995h3pcg/logo.png" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          if (window.location.hostname.includes('lamonte.cafe')) {
            await OneSignal.init({
              appId: "7ef3de6a-8be9-464a-99c6-d977f0899b49",
            });
          } else {
            console.log('OneSignal initialization skipped: Not on production domain (lamonte.cafe)');
          }
        } catch (err) {
          console.warn('OneSignal initialization error caught gracefully:', err);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

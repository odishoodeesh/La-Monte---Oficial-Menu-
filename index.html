<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA MONTE (OFFICIAL MENU)</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/995h3pcg/logo.png" />
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const hostname = window.location.hostname;
        const isProduction = hostname.includes('lamonte.cafe');
        const isLocal = hostname === 'localhost' || hostname === '127.0.0.1';
        
        if (isProduction || isLocal) {
          try {
            await OneSignal.init({
              appId: "7ef3de6a-8be9-464a-99c6-d977f0899b49",
            });
          } catch (err) {
            console.warn('OneSignal initialization failed:', err);
          }
        } else {
          console.log('OneSignal skipped on non-production domain:', hostname);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
